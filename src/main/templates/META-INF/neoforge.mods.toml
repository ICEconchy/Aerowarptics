modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/ICEconchy/Aerowarptics/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/ICEconchy/Aerowarptics"
logoFile = "${mod_id}.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Client-only, and only for the Rift Storm's sky: vanilla has no event for the sky or cloud colour.
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "sable"
type = "required"
reason = "Airships are Sable sub-levels; the warp moves them through Sable's physics pipeline."
versionRange = "[2.0.0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "simulated"
type = "required"
reason = "Provides the physics assembler and controls that turn a contraption into an airship."
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "aeronautics"
type = "required"
reason = "This is a Create: Aeronautics addon."
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
reason = "Adds description pages for this mod's blocks. Nothing here needs JEI to work."
versionRange = "[19.0.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "geckolib"
type = "required"
reason = "Drives and anchors are animated GeckoLib models."
versionRange = "[4.8.0,)"
ordering = "AFTER"
side = "BOTH"
