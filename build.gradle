plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


// ---------------------------------------------------------------------------
// Dependency wiring.
//
// The mods this addon builds against live as jars in ./Depends.  Create and the
// Create: Aeronautics bundle ship several of their libraries as nested
// (jar-in-jar) artifacts; those have been unpacked into ./Depends/lib so that
// they are visible to javac.  ./Depends/lib therefore contains:
//
//   aeronautics / simulated / offroad     - the three mods inside the
//                                           "create-aeronautics-bundled" jar
//   sable-companion / veil / sable-rapier - nested inside sable
//   ponder (contains catnip) / flywheel
//   Registrate                            - nested inside create
//
// The outer "create-aeronautics-bundled" jar carries no classes of its own, so
// it is only useful as documentation of where the inner jars came from and is
// excluded from every classpath.
// ---------------------------------------------------------------------------
def modJars = fileTree(dir: 'Depends', include: '*.jar', exclude: 'create-aeronautics-bundled-*.jar') +
        fileTree(dir: 'Depends/lib', include: '*.jar')

dependencies {
    compileOnly modJars
    additionalRuntimeClasspath modJars
    // Tests exercise classes that reference Sable and Create types in their signatures.
    testCompileOnly modJars
    testRuntimeOnly modJars

    // Unit tests exercise the mod's own logic classes; they need Minecraft on the classpath
    // because several of them extend or reference vanilla types (StringRepresentable, NBT, BlockPos).
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Give the test source set the same Minecraft/NeoForge dependencies as main.
neoForge.addModdingDependenciesTo(sourceSets.test)

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// ---------------------------------------------------------------------------
// Drop the finished jar straight into a Minecraft instance.
//
// Testing this mod means launching a real game with Create, Aeronautics, Sable
// and GeckoLib present, which the Gradle run configs cannot supply.  So every
// build copies its jar into whatever instance "deploy_dir" points at, and the
// only step between changing code and flying a ship is a rebuild.
//
// The path lives in gradle.properties so it can be overridden per machine in
// ~/.gradle/gradle.properties, or for a single build with -Pdeploy_dir=...
// Blank or unset disables the whole thing, so a checkout on another machine
// builds normally without knowing anything about this one.
// ---------------------------------------------------------------------------
def deployDir = providers.gradleProperty('deploy_dir')
def deployJar = tasks.named('jar').flatMap { it.archiveFile }
def deployModId = project.mod_id

var deployToInstance = tasks.register('deployToInstance') {
    group = 'build'
    description = 'Copies the built jar into the Minecraft instance named by deploy_dir.'

    inputs.file(deployJar)
    // No declared output: the destination is outside the project, so let it copy every time rather
    // than trusting an up-to-date check against a directory the game itself writes to.
    onlyIf { deployDir.getOrElse('').trim() != '' }

    doLast {
        var target = new File(deployDir.get().trim())
        if (!target.isDirectory()) {
            logger.error("[deploy] {} is not a directory - jar not deployed. " +
                    "Fix deploy_dir in gradle.properties, or blank it to turn this off.", target)
            return
        }

        var source = deployJar.get().asFile

        // Clear out earlier builds of *this* mod only. Without this a version bump leaves two
        // aerowarptics jars in the folder and the game refuses to start on the duplicate mod id.
        target.listFiles()?.each { file ->
            if (file.name.startsWith(deployModId + '-') && file.name.endsWith('.jar')
                    && file.name != source.name) {
                if (file.delete()) {
                    logger.lifecycle("[deploy] removed stale {}", file.name)
                } else {
                    logger.error("[deploy] could not remove stale {} - remove it by hand or the " +
                            "game will see two copies of this mod.", file.name)
                }
            }
        }

        try {
            java.nio.file.Files.copy(source.toPath(), new File(target, source.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("[deploy] {} -> {}", source.name, target)
        } catch (java.io.IOException e) {
            // Windows holds a lock on every jar a running JVM has open, so this is nearly always
            // "the game is still running". Say so plainly and do not fail the build over it - but do
            // shout, because the alternative is testing yesterday's jar and not knowing.
            logger.error("[deploy] FAILED to write {} into {} - is Minecraft still running? ({})",
                    source.name, target, e.message)
        }
    }
}

// Deployment is a finalizer, so a build that compiles still lands its jar even if a test fails - the
// jar is worth having either way. A compile failure produces no jar at all, so nothing is copied.
tasks.named('build') {
    finalizedBy deployToInstance
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
